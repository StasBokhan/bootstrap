<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <form>
        <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
         <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" aria-describedby="emailHelp" required>
        </div>
                <div class="mb-3">
         <label class="form-label" for="message">Message</label>
            <textarea class="form-control" id="message" name="message" required></textarea>
    </div>
                <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="privacy" name="privacy" required>
            <label class="form-check-label" for="privacy">I accept the privacy policy</label>
    </div>
                <div class="mb-3">
         <label class="form-label" for="image">Upload an image</label>
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
    </div>
        <button type="submit" class="btn btn-primary">Send</button>
        <a href="index.html" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</div>
</body>
</html>
